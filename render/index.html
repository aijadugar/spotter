<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotter Companion Progress</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #111;
      }
      h1 {
        font-size: 1.5rem;
      }
      table {
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.4rem 0.7rem;
        text-align: left;
      }
      #chart {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 120px;
        margin-top: 1rem;
      }
      .bar {
        width: 14px;
        background: #2563eb;
      }
      .empty {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Progress</h1>
    <p>Form score over recent sessions, plus the full session table.</p>
    <div id="chart"></div>
    <table id="sessions">
      <thead>
        <tr><th>Date</th><th>Exercise</th><th>Reps</th><th>Form</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="status" class="empty">Loading...</p>
    <script>
      const profileKey = new URLSearchParams(location.search).get("profile_key") || "default";

      fetch(`/api/history?profile_key=${encodeURIComponent(profileKey)}`)
        .then((r) => r.json())
        .then((rows) => {
          const chart = document.querySelector("#chart");
          const body = document.querySelector("#sessions tbody");
          const status = document.querySelector("#status");
          if (!rows.length) {
            status.textContent = "No sessions recorded yet.";
            return;
          }
          status.textContent = `${rows.length} session(s).`;
          rows.forEach((row) => {
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.height = `${Math.max(4, row.form_score * 120)}px`;
            bar.title = `${row.timestamp}: ${row.form_score}`;
            chart.appendChild(bar);

            const tr = document.createElement("tr");
            tr.innerHTML =
              `<td>${row.timestamp}</td><td>${row.exercise}</td>` +
              `<td>${row.rep_count}</td><td>${row.form_score}</td>`;
            body.appendChild(tr);
          });
        })
        .catch(() => {
          document.querySelector("#status").textContent = "Could not load history.";
        });
    </script>
  </body>
</html>
